{% extends "layout.html" %}

{% block content %}

<h2>Registro de Usuario</h2>

<form action="{{ url_for('result') }}" method="POST">

<p>
Nombre<br>
<input type="text" name="nombre" placeholder="Nombre completo" required>
</p>

<p>
Correo electrónico<br>
<input type="email" name="email" placeholder="ejemplo@mail.com" required>
</p>

<p>
Contraseña<br>
<input type="password" name="pw" placeholder="Contraseña" required>
</p>

<p>
Ciudad<br>
<input type="text" name="ciudad" placeholder="Ciudad">
</p>

<p>
Nivel de estudios<br>
<select name="estudios">
    <option value="ESO">ESO</option>
    <option value="Bachiller">Bachiller</option>
    <option value="FP">FP</option>
    <option value="Universidad">Universidad</option>
</select>
</p>

<p>
<input type="submit" value="Registrarse">
</p>

</form>

<div class="card">
<h3>¿Por qué registrarte?</h3>
<ul>
<li>Guardar historial</li>
<li>Acceso a créditos</li>
<li>Simulación de cuotas</li>
</ul>
</div>

{% endblock %}
