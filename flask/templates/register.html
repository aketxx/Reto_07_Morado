{% extends "layout.html" %}
{% block title %}Registro{% endblock %}

{% block content %}

<div class="auth-form">
    <h2>Crear Cuenta</h2>

    <form method="POST">
        <input type="text" name="username" placeholder="Usuario" required>
        <input type="password" name="password" placeholder="Contraseña" required>
        <button type="submit">Registrarse</button>
    </form>
</div>

{% endblock %}
